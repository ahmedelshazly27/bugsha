<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0}body{width:1280px;height:854px;display:grid;grid-template-columns:75% 25%;overflow:hidden}
.main{background:#5B21B6;display:grid;place-items:center}
.lock{display:flex;align-items:center;gap:40px;color:#fff}
.mark{width:180px;height:180px}
.word{font-family:var(--font-archivo);font-weight:600;font-size:170px;line-height:1;letter-spacing:-0.035em}
.strip{display:grid;grid-template-rows:repeat(3,1fr)}</style></head>
<body><div class="main"><span class="lock">
<svg class="mark" viewBox="0 0 48 48"><path fill="currentColor" d="M24 2.5 45.5 24 24 45.5 2.5 24 24 2.5Z"/><path fill="#fff" fill-opacity=".42" d="M12.5 14h23L24 25.5 12.5 14Z"/></svg><span class="word">Bugsha</span></span></div>
<div class="strip"><div style="background:#EDE9FE"></div><div style="background:#6D28D9"></div><div style="background:#2E1065"></div></div>
</body></html>
