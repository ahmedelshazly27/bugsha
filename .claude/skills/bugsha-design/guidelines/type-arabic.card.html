<!-- @dsCard group="Type" viewport="700x210" name="Arabic pairing" subtitle="Every Latin face is chosen with an Arabic partner of matching weight and rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div class="grid">
  <div style="font-family:var(--font-alexandria);font-size:22px">Bugsha — <span dir="rtl">بقشة</span> <span class="val">Archivo + Alexandria</span></div>
    <div style="font-family:var(--font-plex-arabic);font-size:22px">Cold Chain — <span dir="rtl">سلسلة التبريد</span> <span class="val">IBM Plex Sans + Plex Sans Arabic</span></div>
  <div style="font-family:var(--font-alexandria);font-size:22px">Ticket — <span dir="rtl">قسيمة</span> <span class="val">Archivo + Alexandria</span></div>
  <p class="lbl">Arabic runs at 0.96× size and 1.18× line-height of its Latin counterpart.</p></div></body></html>
