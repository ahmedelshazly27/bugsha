<!-- @dsCard group="Colors" viewport="700x160" name="Semantic roles — dark" subtitle="Same aliases under [data-theme="dark"]" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div data-theme="dark" class="pane" style="background:var(--color-surface-canvas)"><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:8px"><div class="sw"><div class="chip" style="background:var(--color-surface-canvas)"></div><span class="lbl">surface.canvas</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-surface-raised)"></div><span class="lbl">surface.raised</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-text-primary)"></div><span class="lbl">text.primary</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-brand-primary)"></div><span class="lbl">brand.primary</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-fresh)"></div><span class="lbl">fresh</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-time)"></div><span class="lbl">time</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-time-urgent)"></div><span class="lbl">time.urgent</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-error)"></div><span class="lbl">error</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-info)"></div><span class="lbl">info</span><span class="val"></span></div><div class="sw"><div class="chip" style="background:var(--color-deal)"></div><span class="lbl">deal</span><span class="val"></span></div></div></div></body></html>
