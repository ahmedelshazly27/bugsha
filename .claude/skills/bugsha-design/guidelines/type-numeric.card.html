<!-- @dsCard group="Type" viewport="700x160" name="Numerics & the code face" subtitle="Tabular figures everywhere money or time appears" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div class="ds-numeric" style="font-family:var(--font-plex-mono);font-size:36px;line-height:40px;letter-spacing:.12em;font-weight:700">KW-4821</div>
  <div class="ds-numeric" style="font-family:var(--font-plex-mono);font-size:34px;line-height:38px;font-weight:700">KD 2.000</div>
  <p class="lbl">Dinar always renders three decimals. Codes are 2 letters + 4 digits, spaced 0.12em, never lowercase.</p></body></html>
