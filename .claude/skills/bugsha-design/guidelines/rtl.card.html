<!-- @dsCard group="Brand" viewport="700x180" name="RTL mirroring" subtitle="Arabic is a layout, not a skin — the whole axis flips, glyph meaning doesn't" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div class="row" style="gap:16px;align-items:stretch">
  <div class="pane" style="flex:1;background:var(--color-surface-raised);border:1px solid var(--color-border-subtle)">
    <div style="display:flex;align-items:center;gap:8px"><img src="../assets/icons/clock.svg" width="16"><b style="font-size:14px">Tonight 21:30–22:30</b></div>
    <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px"><span>Kuwait Bakehouse</span><img src="../assets/icons/chevron-right.svg" width="16"></div></div>
  <div dir="rtl" class="pane" style="flex:1;background:var(--color-surface-raised);border:1px solid var(--color-border-subtle);font-family:var(--font-arabic-body)">
    <div style="display:flex;align-items:center;gap:8px"><img src="../assets/icons/clock.svg" width="16"><b style="font-size:14px">الليلة ٢١:٣٠–٢٢:٣٠</b></div>
    <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px"><span>مخبز الكويت</span><img src="../assets/icons/chevron-right.svg" width="16" style="transform:scaleX(-1)"></div></div></div>
  <p class="lbl" style="margin-top:10px">Flips: layout axis, chevrons, arrows, progress, slide-to-redeem. Never flips: clock faces, media controls, logos, the KNET mark, phone numbers, Latin brand names.</p></body></html>
