<!-- @dsCard group="Brand" viewport="700x210" name="Imagery policy" subtitle="Never the contents — storefront tone plates, partner photography, or nothing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--color-surface-canvas);font-family:var(--font-body)}
.row{display:flex;gap:12px}.plate{width:150px;height:104px;border-radius:var(--radius-image);overflow:hidden;position:relative;background:var(--color-surface-sunken)}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;inset-inline-start:8px;bottom:8px;font-family:var(--font-plex-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.lbl{font-family:var(--font-plex-mono);font-size:11px;line-height:16px;color:var(--color-text-secondary)}</style></head>
<body data-variant="diwaniya"><div class="row">
<span class="plate"><img src="../assets/photos/tone-bakehouse.png"><span class="tag">bakehouse</span></span>
<span class="plate"><img src="../assets/photos/tone-mezze.png"><span class="tag">mezze</span></span>
<span class="plate"><img src="../assets/photos/tone-coop.png"><span class="tag">co-op</span></span>
<span class="plate" style="background:var(--color-brand-tint);display:grid;place-items:center"><img src="../assets/icons/croissant.svg" width="26" height="26" style="width:26px;height:26px;object-fit:none"><span class="tag" style="color:var(--color-text-secondary);text-shadow:none">category plate</span></span>
<span class="plate" data-variant="ticket" style="border:1.5px solid var(--color-border-default);border-radius:0;display:grid;place-items:center"><span class="lbl">TICKET: NONE</span></span>
</div>
<p class="lbl" style="margin-top:12px">Allowed: partner storefront and staff, packaging, and warm out-of-focus interior crops (shipped in <b>assets/photos/</b> as stand-ins — replace with real shoots). Never a hero shot of food that may not be in the bundle.</p>
</body></html>
