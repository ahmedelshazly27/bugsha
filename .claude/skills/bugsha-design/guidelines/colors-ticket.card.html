<!-- @dsCard group="Colors" viewport="700x150" name="Ticket palette" subtitle="Newsprint, ink, one spot red — two colours and a printer" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px"><div class="sw"><div class="chip" style="background:#EFEDE6"></div><span class="lbl">paper.100</span><span class="val">#EFEDE6</span></div><div class="sw"><div class="chip" style="background:#E2DFD3"></div><span class="lbl">paper.200</span><span class="val">#E2DFD3</span></div><div class="sw"><div class="chip" style="background:#111110"></div><span class="lbl">ink.900</span><span class="val">#111110</span></div><div class="sw"><div class="chip" style="background:#5C5A54"></div><span class="lbl">ink.500</span><span class="val">#5C5A54</span></div><div class="sw"><div class="chip" style="background:#E4322B"></div><span class="lbl">red.500</span><span class="val">#E4322B</span></div><div class="sw"><div class="chip" style="background:#1B4AE0"></div><span class="lbl">blue.500</span><span class="val">#1B4AE0</span></div><div class="sw"><div class="chip" style="background:#1E7A4C"></div><span class="lbl">green.600</span><span class="val">#1E7A4C</span></div></div></body></html>
