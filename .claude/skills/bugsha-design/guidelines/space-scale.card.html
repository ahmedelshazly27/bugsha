<!-- @dsCard group="Spacing" viewport="700x150" name="Space scale" subtitle="4px base; 100 = 8px is the unit everything else multiplies" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div class="row" style="align-items:flex-end"><div class="sw"><div style="width:2px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">25</span><span class="val">2px</span></div><div class="sw"><div style="width:4px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">50</span><span class="val">4px</span></div><div class="sw"><div style="width:8px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">100</span><span class="val">8px</span></div><div class="sw"><div style="width:12px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">150</span><span class="val">12px</span></div><div class="sw"><div style="width:16px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">200</span><span class="val">16px</span></div><div class="sw"><div style="width:24px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">300</span><span class="val">24px</span></div><div class="sw"><div style="width:32px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">400</span><span class="val">32px</span></div><div class="sw"><div style="width:40px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">500</span><span class="val">40px</span></div><div class="sw"><div style="width:48px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">600</span><span class="val">48px</span></div><div class="sw"><div style="width:64px;height:48px;background:var(--color-brand-primary);border-radius:2px"></div><span class="lbl">800</span><span class="val">64px</span></div></div></body></html>
