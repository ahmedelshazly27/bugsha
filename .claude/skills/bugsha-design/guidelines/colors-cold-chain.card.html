<!-- @dsCard group="Colors" viewport="700x150" name="Cold Chain palette" subtitle="Instrument slate + one warm accent so it never goes clinical" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px"><div class="sw"><div class="chip" style="background:#F4F6F8"></div><span class="lbl">slate.50</span><span class="val">#F4F6F8</span></div><div class="sw"><div class="chip" style="background:#D7DEE6"></div><span class="lbl">slate.200</span><span class="val">#D7DEE6</span></div><div class="sw"><div class="chip" style="background:#0E1620"></div><span class="lbl">slate.900</span><span class="val">#0E1620</span></div><div class="sw"><div class="chip" style="background:#1257E0"></div><span class="lbl">blue.500</span><span class="val">#1257E0</span></div><div class="sw"><div class="chip" style="background:#00A878"></div><span class="lbl">green.500</span><span class="val">#00A878</span></div><div class="sw"><div class="chip" style="background:#E08A00"></div><span class="lbl">amber.500</span><span class="val">#E08A00</span></div><div class="sw"><div class="chip" style="background:#FF7A45"></div><span class="lbl">orange.500</span><span class="val">#FF7A45</span></div></div></body></html>
