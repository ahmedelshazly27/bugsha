<!-- @dsCard group="Spacing" viewport="700x150" name="Touch targets" subtitle="44px floor, 52px for the one action a user takes standing at a counter" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div class="row" style="gap:12px;align-items:center">
  <div style="height:32px;padding:0 16px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--color-surface-sunken);font-size:13px">32 · sm, non-critical</div>
  <div style="height:44px;padding:0 20px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--color-surface-raised);border:1px solid var(--color-border-default);font-size:15px">44 · md, floor</div>
  <div style="height:52px;padding:0 24px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--color-brand-primary);color:var(--color-text-on-brand);font-weight:600">52 · lg, primary</div></div></body></html>
