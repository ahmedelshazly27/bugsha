<!-- @dsCard group="Brand" viewport="700x150" name="Elevation" subtitle="Soft depth in three variants; Ticket replaces shadow with a 3px hard offset" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:var(--color-surface-canvas);color:var(--color-text-primary)}
.grid{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:grid;gap:6px;justify-items:start}.chip{width:100%;height:44px;border-radius:8px;border:1px solid var(--color-border-subtle)}
.lbl{font-size:11px;line-height:14px;color:var(--color-text-secondary);font-family:var(--font-plex-mono)}
.val{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-plex-mono)}
.pane{padding:14px;border-radius:12px}</style></head><body><div class="row" style="gap:18px"><div class="sw"><div style="width:100px;height:60px;background:var(--color-surface-raised);border-radius:12px;box-shadow:var(--elevation-1)"></div><span class="lbl">elevation-1</span></div><div class="sw"><div style="width:100px;height:60px;background:var(--color-surface-raised);border-radius:12px;box-shadow:var(--elevation-2)"></div><span class="lbl">elevation-2</span></div><div class="sw"><div style="width:100px;height:60px;background:var(--color-surface-raised);border-radius:12px;box-shadow:var(--elevation-3)"></div><span class="lbl">elevation-3</span></div><div class="sw"><div style="width:100px;height:60px;background:var(--color-surface-raised);border-radius:12px;box-shadow:var(--elevation-4)"></div><span class="lbl">elevation-4</span></div><div data-variant="ticket" class="sw"><div style="width:100px;height:60px;background:var(--color-surface-raised);border:1.5px solid var(--color-border-default);box-shadow:var(--elevation-print)"></div><span class="lbl">print (Ticket)</span></div></div></body></html>
